version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - "5672:5672"     # RabbitMQ broker port
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - rabbitnet

networks:
  rabbitnet:
    driver: bridge
